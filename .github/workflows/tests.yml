name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: kit_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_MYSQL_DATABASE: kit_ci
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: ci-only-password
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r WebDataBase/requirements.txt -r KitAssembly/requirements.txt
      - name: Migration consistency
        working-directory: WebDataBase
        run: python tests/test_migrations.py -v
      - name: Backend SQLite regressions
        working-directory: WebDataBase
        run: python manage.py test WebDatabase.tests LabDatabase.tests --settings=WebDataWorld.test_settings
      - name: Backend MySQL regressions and catalog import
        working-directory: WebDataBase
        run: python manage.py test WebDatabase.tests LabDatabase.tests --settings=WebDataWorld.test_mysql_settings --noinput
      - name: Frontend regressions
        working-directory: KitAssembly/kitapp
        run: python manage.py test kitserver --settings=kitapp.test_settings
      - name: HTML rendering regression
        run: node --test tests/html_rendering.test.cjs

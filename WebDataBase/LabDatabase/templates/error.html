{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面错误 - 基因元件数据库</title>
    <link rel="stylesheet" href="{% static 'LabDatabase/css/error.css'%}">
</head>
<body>
    <div class="error-container">
        <div class="error-header">
            <h1>页面错误</h1>
            <div class="error-code">错误代码: 404</div>
        </div>
        
        <div class="error-content">
            <div class="error-icon">⚠️</div>
            <p class="error-message">
                抱歉，您请求的基因元件页面无法找到。这可能是因为元件ID不存在、页面已被移除或输入了错误的URL。
            </p>
            
            <div class="dna-animation">
                <div class="dna-strand">
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                    <div class="nucleotide"></div>
                </div>
            </div>
            
            <div class="error-details">
                <h3>可能的原因：</h3>
                <ul>
                    <li>基因元件ID输入错误</li>
                    <li>该元件已从数据库中移除</li>
                    <li>页面链接已过期</li>
                    <li>服务器暂时无法处理您的请求</li>
                </ul>
            </div>
            
            <div class="error-actions">
                <a href="#" class="btn btn-primary">
                    <i>🏠</i> 返回首页
                </a>
                <a href="#" class="btn btn-secondary">
                    <i>🔍</i> 搜索基因元件
                </a>
                <a href="#" class="btn btn-secondary">
                    <i>📧</i> 联系支持团队
                </a>
            </div>
        </div>
        
        <div class="error-footer">
            <p>基因元件数据库 &copy; 2023 | 如果您认为这是一个错误，请联系我们的技术支持团队</p>
        </div>
    </div>
</body>
</html>
